version: '3.8'

services:
  # ── MongoDB Atlas replacement for local dev ─────────
  mongodb:
    image: mongo:7
    container_name: jobtailor-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: jobtailor
      MONGO_INITDB_ROOT_PASSWORD: ***REMOVED-DEV-PASSWORD***
      MONGO_INITDB_DATABASE: jobtailor
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API Server ─────────────────────────────────
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: jobtailor-server
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://jobtailor:***REMOVED-DEV-PASSWORD***@mongodb:27017/jobtailor?authSource=admin
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars-here
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-min-32-chars
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_ROUNDS: 10
      # Set these to your actual keys:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./apps/server:/app/apps/server:ro

  # ── Frontend Client (optional — use npm run dev locally) ──
  client:
    image: node:22-alpine
    container_name: jobtailor-client
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - ./apps/client:/app:ro
      - client_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - server

volumes:
  mongodb_data:
  client_node_modules:

# ── Networks (for inter-service communication) ────────
networks:
  default:
    name: jobtailor-network
