<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobTailor Auto-Track</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 16px;
        font-size: 14px;
      }
      .muted {
        color: #666;
      }
      .row {
        margin: 10px 0;
      }
      .title {
        font-weight: 700;
        font-size: 15px;
      }
      .company {
        color: #444;
      }
      .url {
        font-size: 11px;
        color: #888;
        word-break: break-all;
      }
      button {
        padding: 8px 14px;
        margin-right: 8px;
        cursor: pointer;
      }
      #add {
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 6px;
      }
      #skip {
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      #result {
        margin-top: 10px;
      }
      #result.ok {
        color: #15803d;
      }
      #result.err {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="root"><span class="muted">Loading…</span></div>
    <script src="popup.js"></script>
  </body>
</html>
