name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build & test
    runs-on: ubuntu-latest

    # No database service container: every server test connects through
    # mongodb-memory-server (apps/server/src/tests/helpers/test-db.ts), which
    # downloads its own mongod binary. A mongo:7 service was provisioned here
    # previously but never used — removed 2026-09-27 (better-harness review).

    env:
      # CI-only values — never reuse real secrets in workflows.
      # Tests import auth services which sign JWTs, so non-empty secrets are required.
      JWT_SECRET: ci-only-test-secret-do-not-use-in-any-environment-0123456789
      JWT_REFRESH_SECRET: ci-only-test-refresh-secret-do-not-use-in-any-env-0123456789
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Root task runs every workspace suite through turbo: server, client,
      # and extension. Adding a workspace with a test script automatically
      # joins this gate — no workflow edit needed.
      - name: Tests (all workspaces)
        run: npm run test

      # Coverage floor gate: vitest.config.ts declares thresholds and the
      # provider throws when they are missed, so this step fails the build on
      # regression. Measured surface widened 2026-09-27 to include controllers
      # and routes (the highest-churn paths): stmts 55.59 / branch 68.72 /
      # funcs 59.37 / lines 55.59; floors set to 55/50/59/55 from that
      # measurement (services-only surface measured 67-75% the same day).
      - name: Server coverage floor
        run: npm run test:coverage --workspace=job-tailor-server
