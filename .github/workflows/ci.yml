name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build & test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values — never reuse real secrets in workflows.
      # Tests import auth services which sign JWTs, so non-empty secrets are required.
      JWT_SECRET: ci-only-test-secret-do-not-use-in-any-environment-0123456789
      JWT_REFRESH_SECRET: ci-only-test-refresh-secret-do-not-use-in-any-env-0123456789
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Server tests
        run: npm run test --workspace=job-tailor-server

      - name: Client tests
        run: npm run test --workspace=job-tailor-client
